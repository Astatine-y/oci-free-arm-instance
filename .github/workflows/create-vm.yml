name: create-oci-arm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI Python SDK
        run: |
          python3 -m pip install --upgrade pip
          pip install oci jq

      - name: Configure OCI CLI env
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p $HOME/.oci
          cat > $HOME/.oci/config <<'EOF'
[DEFAULT]
user=${OCI_CLI_USER}
tenancy=${OCI_CLI_TENANCY}
region=${OCI_CLI_REGION}
fingerprint=${OCI_CLI_FINGERPRINT}
key_file=$HOME/.oci/oci_api_key.pem
EOF
          echo "${OCI_CLI_KEY_CONTENT}" > $HOME/.oci/oci_api_key.pem
          chmod 600 $HOME/.oci/oci_api_key.pem

      - name: Launch Always-Free A1 Flex instance
        id: create
        env:
          COMPARTMENT_OCID: ${{ secrets.COMPARTMENT_OCID }}
          AVAILABILITY_DOMAIN: ${{ secrets.AVAILABILITY_DOMAIN }}
          IMAGE_OCID: ${{ secrets.IMAGE_OCID }}
          SUBNET_OCID: ${{ secrets.SUBNET_OCID }}
        run: |
          set -euo pipefail
          SHAPE="VM.Standard.A1.Flex"
          SHAPE_CONFIG='{"ocpus":4,"memoryInGBs":24}'
          BOOT_VOL=50
          DISPLAY_NAME="a1-free-automated-$(date +%s)"

          echo "Launching instance with shape ${SHAPE} and shape-config ${SHAPE_CONFIG}..."
          oci compute instance launch \
            --compartment-id "$COMPARTMENT_OCID" \
            --availability-domain "$AVAILABILITY_DOMAIN" \
            --image-id "$IMAGE_OCID" \
            --subnet-id "$SUBNET_OCID" \
            --shape "$SHAPE" \
            --shape-config "$SHAPE_CONFIG" \
            --boot-volume-size-in-gbs $BOOT_VOL \
            --assign-public-ip true \
            --display-name "$DISPLAY_NAME" \
            --output json > launch.json || true

          cat launch.json

          # If API returned an error object, treat as failure
          if jq -e '.code? // empty' launch.json >/dev/null; then
            echo "API error detected in launch.json"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          INSTANCE_OCID=$(jq -r '.data.id // .id // empty' launch.json)
          LAUNCHED_SHAPE=$(jq -r '.data.shape // .shape // empty' launch.json)
          OCPS=$(jq -r '.data.shapeConfig.ocpus // .shapeConfig.ocpus // empty' launch.json)
          MEM=$(jq -r '.data.shapeConfig.memoryInGBs // .shapeConfig.memoryInGBs // empty' launch.json)

          echo "Instance OCID: $INSTANCE_OCID"
          echo "Shape: $LAUNCHED_SHAPE"
          echo "OCPUs: ${OCPS:-unknown} MemoryGB: ${MEM:-unknown}"

          if [ -n "$INSTANCE_OCID" ] && [ "$LAUNCHED_SHAPE" = "VM.Standard.A1.Flex" ] && [ -n "$OCPS" ] && [ -n "$MEM" ] && [ "$OCPS" -le 4 ] && [ "$MEM" -le 24 ]; then
            echo "created=true" >> $GITHUB_OUTPUT
            echo "instance_ocid=$INSTANCE_OCID" >> $GITHUB_OUTPUT
          else
            echo "created=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify via Telegram on success
        if: steps.create.outputs.created == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INSTANCE_OCID: ${{ steps.create.outputs.instance_ocid }}
        run: |
          TEXT="✅ OCI Always‑Free ARM instance created: ${INSTANCE_OCID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="$TEXT"

      - name: Upload launch log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-launch-log
          path: launch.json
